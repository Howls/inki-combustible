name: Precio combustible

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 07:30/08:30 en Espana
  workflow_dispatch:        # tambien se puede lanzar a mano desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fuel.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv data.json
          git diff --cached --quiet || git commit -m "Actualiza precios $(date -u +%F)"
          git push
